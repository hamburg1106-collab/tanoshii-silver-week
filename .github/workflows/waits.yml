name: 待ち時間を取得

on:
  schedule:
    # UTC。JST 9:00〜18:59 のあいだだけ5分おきに動かす。
    # GitHub の cron は混み具合で数分ずれることがある（当日の用途では許容範囲）。
    - cron: '*/5 0-9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 使う日が過ぎたら自分で自分を止めるために要る
  actions: write

concurrency:
  group: waits
  cancel-in-progress: false

env:
  # この日を過ぎたら動かない。
  # queue-times.com は無料で使わせてもらっているので、
  # 用が済んだあとも1日120回叩き続けるのはただの迷惑になる。
  LAST_DAY: '2026-09-22'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - id: guard
        name: 使う日かどうか見る
        run: |
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if [[ "$today" > "$LAST_DAY" ]]; then
            echo "$today は $LAST_DAY を過ぎているので何もしない"
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      # ── 使う日が過ぎていたら、取得せずに自分を無効化して終わる ──
      - if: steps.guard.outputs.run == 'false'
        name: このワークフローを止める
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/waits.yml/disable"
          echo '役目が終わったので、このワークフローを無効にしました'

      # ── ここから下は使う日だけ ──
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - if: steps.guard.outputs.run == 'true'
        name: queue-times から取得
        run: node scripts/fetch-waits.mjs > "$RUNNER_TEMP/waits.json"

      - if: steps.guard.outputs.run == 'true'
        name: data ブランチに上書きする
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 履歴は残さず常に1コミットだけにする。
          # 5分おきに走るので、積み上げるとデータベースの体裁になってしまう。
          git checkout --orphan data
          git rm -rf . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP/waits.json" waits.json
          git add waits.json
          git commit -q -m "待ち時間 $(date -u '+%Y-%m-%d %H:%MZ')"
          git push -f origin data
